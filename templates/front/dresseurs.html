{% extends 'front/base.html' %}

{% block content %}

<main class="m-10 p-10 border-2 rounded-lg">

  <!-- Titre -->
  <h1 class="flex justify-center text-3xl font-bold mb-10">
    Tous les Dresseurs
  </h1>

  <!-- Grille des dresseurs -->
  <section class="flex flex-wrap justify-center gap-8">

    {% for dresseur in dresseurs %}

    <div class="w-56 bg-yellow-100 rounded-2xl border-4 border-yellow-400 shadow-xl p-4 flex flex-col items-center">

      <!-- Avatar -->
      <div class="bg-white rounded-full border-2 border-gray-300 w-28 h-28 flex items-center justify-center mb-3 overflow-hidden">
        <img 
          src="{{ dresseur.avatar }}"
          alt="{{ dresseur.pseudo }}"
          class="w-full h-full object-cover"
        />
      </div>

      <!-- Pseudo -->
      <h2 class="text-lg font-bold text-gray-800 mb-2 text-center">
        {{ dresseur.pseudo }}
      </h2>

      <!-- Nombre de pokémons -->
      <span class="px-3 py-1 text-sm font-semibold rounded-full bg-yellow-400 text-gray-900">
        {{ dresseur.nb_pokemons }} Pokémon(s)
      </span>

    </div>

    {% endfor %}

  </section>

</main>

{% endblock %}
