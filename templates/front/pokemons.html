{% extends 'front/base.html' %}

{% block content %}

<main class="m-10 p-10 border-2 rounded-lg">

  <!-- Titre -->
  <h1 class="flex justify-center text-3xl font-bold mb-10">
    Tous les Pokémons
  </h1>

  <!-- Grille des pokémons -->
  <section class="flex flex-wrap justify-center gap-8">

    {% for pokemon in pokemons %}
    <div class="w-64 aspect-[2.5/3.5] bg-yellow-100 rounded-2xl border-4 border-yellow-400 shadow-xl p-3 flex flex-col">
      <!-- Nom -->
      <h2 class="text-lg font-bold text-gray-800 mb-2 text-center">
        {{ pokemon.nom }}
      </h2>
      <!-- Image -->
      <div class="bg-white rounded-lg border-2 border-gray-300 flex items-center justify-center mb-2 h-36">
        <img 
          src="{{ pokemon.image }}"
          alt="{{ pokemon.nom }}"
          class="h-32 object-contain"
        />
      </div>
      <!-- Type -->
      <div class="flex justify-center mb-2">
        <span class="px-3 py-1 text-sm font-semibold rounded-full bg-yellow-400 text-gray-900">
          {{ pokemon.type }}
        </span>
      </div>
      <!-- Description -->
      <p class="text-xs text-gray-700 bg-yellow-50 border border-yellow-300 rounded-lg p-2 flex-1 overflow-auto">
        {{ pokemon.description }}
      </p>
    </div>
    {% endfor %}

  </section>

</main>

{% endblock %}
